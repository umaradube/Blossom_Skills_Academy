    <!-- Arms -->
    <rect x="-50" y="10" width="25" height="15" rx="7" fill="#FFD5B9"/>
    <rect x="25" y="10" width="25" height="15" rx="7" fill="#FFD5B9"/>
  </g>
  <text x="400" y="550" text-anchor="middle" font-size="28" font-weight="bold" fill="white" font-family="Arial">Hands-On Skills Training</text>
