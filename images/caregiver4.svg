<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg4)"/>
  <circle cx="400" cy="300" r="180" fill="rgba(255,255,255,0.1)"/>
  <circle cx="400" cy="300" r="140" fill="rgba(255,255,255,0.15)"/>
  <g transform="translate(400, 280)">
    <!-- Head -->
    <circle cx="0" cy="-40" r="35" fill="#FFD5B9"/>
    <!-- Graduation cap -->
    <path d="M -45 -55 L 0 -65 L 45 -55 L 30 -50 L 0 -58 L -30 -50 Z" fill="#1F2937"/>
    <line x1="0" y1="-65" x2="20" y2="-75" stroke="#C8A96E" stroke-width="3"/>
    <!-- Body -->
    <rect x="-25" y="0" width="50" height="70" rx="10" fill="#EC4899"/>
    <!-- Diploma/Certificate -->
    <g transform="translate(0, 35)">
      <rect x="-35" y="-15" width="70" height="30" rx="3" fill="#FFFFFF" opacity="0.9"/>
      <line x1="-30" y1="-8" x2="30" y2="-8" stroke="#1F2937" stroke-width="2"/>
      <line x1="-25" y1="0" x2="25" y2="0" stroke="#1F2937" stroke-width="1" opacity="0.5"/>
      <line x1="-25" y1="8" x2="25" y2="8" stroke="#1F2937" stroke-width="1" opacity="0.5"/>
    </g>
  </g>
  <text x="400" y="550" text-anchor="middle" font-size="28" font-weight="bold" fill="white" font-family="Arial">Accredited Certification</text>
</svg>